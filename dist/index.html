  <body>
    <div id="root"></div>
    <script>
      var vapiInstance = null;

      const getVapiFloatingButton = () => {
        const button = document.querySelector(
          '#vapi-support-btn, .vapi-btn, .vapi-fab, button[class*="vapi"], [class*="vapi"] button'
        );
        if (button && !button.id) button.id = 'vapi-floating-call-btn';
        return button;
      };

      const startVapiVoiceCall = () => {
        if (vapiInstance && typeof vapiInstance.start === 'function') {
          vapiInstance.start();
          return;
        }
        getVapiFloatingButton()?.click();
      };

      window.addEventListener('start-vapi-voice-call', startVapiVoiceCall);
      new MutationObserver(getVapiFloatingButton).observe(document.body, {
        childList: true,
        subtree: true,
      });

      const visitVapi = () => {
        vapiInstance = window.vapiSDK.run({
          apiKey: "d11ecb29-b257-440b-a870-d6a28aecdc49",
          assistant: "54c49c5e-fd99-40aa-879f-b6343146595f",
          config: {
            position: "bottom-right",
            offset: "24px",
            width: "50px",
            height: "50px",
            idle: {
              color: "rgb(217, 119, 6)",
            }
          }
        });
        getVapiFloatingButton();
      };

      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
      script.defer = true;
      script.async = true;
      script.onload = visitVapi;
      document.body.appendChild(script);
    </script>
  </body>
